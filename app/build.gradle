plugins {
    id 'com.android.application'
}

android {
    namespace 'com.texttoimage.ai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.texttoimage.ai'
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "12"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    // ✅ Simple dependency, kuch extra nahi
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
