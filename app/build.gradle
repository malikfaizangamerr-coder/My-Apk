plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourname.mywebapp'
    compileSdk 33

    defaultConfig {
        applicationId 'com.yourname.mywebapp'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
