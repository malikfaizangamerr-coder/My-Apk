plugins {
    id 'com.android.application'
}

android {
    namespace 'com.texttoimage.ai'      // ✅ Naya package name
    compileSdk 34

    defaultConfig {
        applicationId 'com.texttoimage.ai'  // ✅ Naya package name
        minSdk 21
        targetSdk 34
        versionCode 8                       // ✅ 8
        versionName "12"                    // ✅ 12
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
