pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // ✅ Unity Ads Maven Repository - Required for Unity Ads SDK
        maven {
            url "https://artifacts.unity.com/unity/maven/"
        }
    }
}

rootProject.name = "My-Apk"
include ':app'
