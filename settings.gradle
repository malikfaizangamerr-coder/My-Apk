pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.maven.apache.org/maven2/"
        }
        maven {
            url "https://jitpack.io"
        }
        // Start.io SDK repository
        maven {
            url "https://maven.start.io/repository/maven-releases/"
        }
    }
}

rootProject.name = "My-Apk"
include ':app'
